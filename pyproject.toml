[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saga-sar"
version = "0.1.0"
description = "Schema-grounded, evidence-aware agent framework for SAR data generation and augmentation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Xuanting Wu"},
  {name = "Fan Zhang"},
  {name = "Fei Ma"},
  {name = "Ling Guan"},
  {name = "Guochun Ma"},
  {name = "Yongsheng Zhou"},
]
keywords = ["synthetic-aperture-radar", "SAR", "data-augmentation", "agents", "dataset-profiling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.5",
  "PyYAML>=6.0",
  "requests>=2.31",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=7.4",
  "ruff>=0.6",
]
plots = [
  "matplotlib>=3.7",
  "pandas>=2.0",
  "seaborn>=0.13",
]

[project.scripts]
saga = "saga.cli:main"

[tool.setuptools.packages.find]
include = ["saga*"]

[tool.setuptools.data-files]
"share/saga/configs" = ["configs/saga.yaml"]
"share/saga/configs/datasets" = ["configs/datasets/*.yaml"]
"share/saga/configs/format_specs" = ["configs/format_specs/*.yaml"]
"share/saga/configs/llm" = ["configs/llm/*.yaml"]
"share/saga/configs/requests" = ["configs/requests/*.yaml"]
"share/saga/configs/skills" = ["configs/skills/*.yaml"]
"share/saga/configs/smoke" = ["configs/smoke/*.yaml"]
"share/saga/configs/smoke/assets" = ["configs/smoke/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["myproject", "runs", "tmp"]

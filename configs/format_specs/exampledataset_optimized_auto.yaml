      class: class
      target_name: target_name
      azimuth: azimuth_deg
      polarization: polarization
    constants:
      band: X
    confidence: 0.782
    support_in_inspection: 43
  - name: saga_sea_state_aircraft
    target: relative_path
    pattern: ^(?P<class>[^/]+)/海况(?P<sea_state>\d+)级_(?P<processing>[^_]+)_(?P<target_name_cn>.+?)[(（](?P<target_group>.*?)[)）]_(?P<param_1>-?\d+(?:\.\d+)?)_(?P<incidence>-?\d+(?:\.\d+)?)_(?P<azimuth>-?\d+(?:\.\d+)?)_(?P<resolution>-?\d+(?:\.\d+)?)_(?P<band>[A-Za-z0-9]+)\.[^.]+$

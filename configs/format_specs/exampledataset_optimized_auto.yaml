      band: X
    confidence: 0.582
    support_in_inspection: 6
  - name: saga_name_attr_azim_pol
    target: relative_path
    pattern: ^(?:.+?/)?(?P<class>[^/]+)/(?P<target_name>.+?)[(（](?P<target_attr>.*?)[)）]_(?P<azimuth>-?\d+(?:\.\d+)?)_(?P<polarization>hh|hv|vh|vv|pauli)\.[^.]+$
    fields:
      class: class
      target_name: target_name
      target_attr: target_serial_or_attr
      azimuth: azimuth_deg
      polarization: polarization
    constants:
      band: X
    confidence: 0.707
    support_in_inspection: 29
  - name: saga_name_azim_pol
    target: relative_path
    pattern: ^(?:.+?/)?(?P<class>[^/]+)/(?P<target_name>[^/()（）]+)_(?P<azimuth>-?\d+(?:\.\d+)?)_(?P<polarization>hh|hv|vh|vv|pauli)\.[^.]+$

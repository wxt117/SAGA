      class: class
      sea_state: sea_state
      processing: processing
      target_name_cn: target_name_cn
      target_group: target_group
      param_1: param_1
      incidence: incidence_angle_deg
      azimuth: azimuth_deg
      resolution: resolution_m
      band: band
    constants: {}
    confidence: 0.582

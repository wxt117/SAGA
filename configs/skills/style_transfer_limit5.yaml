style_transfer:
  name: StyleTransferSkill
  description: Small real-run test config for myproject/stytransfer.
  adapter:
    entrypoint: myproject/stytransfer/style_transfer_general.py
    conda_env: sd3
    model_path: runwayml/stable-diffusion-v1-5
    device: cuda:0
    image_size: 512
    steps: 200
    lr: 0.05
    content_weight: 0.25
    seed: 2025
    self_layers: "10,16"
    limit: 5
    overwrite: true
